plugins {
    id 'java-library'

    id 'com.vanniktech.maven.publish'
    id 'net.neoforged.moddev' version '2.0.140'
}

def myotusRootDir = rootProject.layout.projectDirectory.asFile
def moduleGuideSources = project.file('src/main/resources/assets/myotus/ae2guide').absolutePath

if (findProperty('widget_smoke') == 'true') {
    sourceSets.main.java.srcDir 'src/smoke/java'
}

sourceSets {
    gameTest {
        resources.srcDir rootProject.file('common/src/gameTest/resources')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

configurations {
    gameTestImplementation.extendsFrom implementation
    gameTestCompileOnly.extendsFrom compileOnly
    gameTestRuntimeOnly.extendsFrom runtimeOnly
}

def prepareMultiplayerTest = tasks.register('prepareMultiplayerTest', Copy) {
    doNotTrackState('Runtime directories contain live settings and locked world files.')
    from 'src/multiplayer'
    into 'run-multiplayer'
    // Seed isolated test profiles without overwriting their later settings or worlds.
    eachFile { details ->
        if (new File(destinationDir, details.relativePath.pathString).exists()) {
            details.exclude()
        }
    }
    includeEmptyDirs = false
}

neoForge {
    version = project.neo_version
    addModdingDependenciesTo sourceSets.gameTest

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        myotus_gametest {
            sourceSet(sourceSets.gameTest)
        }
    }

    runs {
        client {
            client()
            gameDirectory = project.file('run-client')
            systemProperty 'myotus.widgetSmoke', findProperty('widget_smoke') ?: 'false'

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            systemProperty("guideme.ae2.guide.sources", moduleGuideSources)
            systemProperty("guideme.ae2.guide.sourcesNamespace", mod_id)

        }

        server {
            server()
            gameDirectory = project.file('run-server')
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        multiplayerServer {
            server()
            gameDirectory = project.file('run-multiplayer/server')
            programArgument '--nogui'
            jvmArgument '-Xmx2G'
            taskBefore prepareMultiplayerTest
        }

        [1, 2].each { index ->
            create("multiplayerClient${index}") {
                client()
                gameDirectory = project.file("run-multiplayer/client${index}")
                def playerName = "MyotusTester${index}".toString()
                programArguments.addAll '--username', playerName,
                        '--uuid', UUID.nameUUIDFromBytes("OfflinePlayer:${playerName}".getBytes('UTF-8')).toString(),
                        '--quickPlayMultiplayer', '127.0.0.1:25575', '--width', '960', '--height', '640'
                jvmArgument '-Xmx2G'
                systemProperty 'guideme.ae2.guide.sources', moduleGuideSources
                systemProperty 'guideme.ae2.guide.sourcesNamespace', mod_id
                taskBefore prepareMultiplayerTest
            }
        }

        gameTestServer {
            type = "gameTestServer"
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            loadedMods = [mods.myotus, mods.myotus_gametest]
            sourceSet = sourceSets.gameTest
        }

        data {
            data()
            gameDirectory = project.file('run-data')

            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            if (name != 'gameTestServer') loadedMods = [mods.myotus]
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'myotus.startupVersionMismatchTest', (findProperty('myotusStartupVersionMismatchTest') ?: 'false').toString()

            logLevel = name.startsWith('multiplayer') ? org.slf4j.event.Level.INFO : org.slf4j.event.Level.DEBUG
        }
    }

    unitTest {
        enable()
        testedMod = mods.myotus
    }
}

tasks.named('runMultiplayerServer', JavaExec).configure {
    standardInput = System.in
}

dependencies {
    api('me.myogoo:ssec-commands-1.21.1:1.0.0-SNAPSHOT')
    jarJar('me.myogoo:ssec-commands-1.21.1:1.0.0-SNAPSHOT') { version { strictly '[1.0.0-SNAPSHOT,2.0.0)'; prefer '1.0.0-SNAPSHOT' } }

    implementation "org.appliedenergistics:appliedenergistics2:${AE2_version}"

    // Optional recipe-viewer bridges; neither viewer is required at runtime.
    compileOnly 'mezz.jei:jei-1.21.1-neoforge:19.19.3.224'
    testRuntimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.19.3.224'
    compileOnly 'dev.emi:emi-neoforge:1.1.22+1.21.1'

    compileOnly "org.appliedenergistics:guideme:${Guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${Guideme_version}"

    compileOnly "de.mari_023:ae2wtlib_api:${project.AE2WTLib_version}"
    if (project.enable_ae2wt == "true") {
        modDevRuntimeDependencies "de.mari_023:ae2wtlib_api:${project.AE2WTLib_version}"
        modDevRuntimeDependencies "de.mari_023:ae2wtlib:${project.AE2WTLib_version}"
    }
}

repositories {
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
    maven {
        url = 'https://maven.terraformersmc.com/'
        content { includeGroup 'dev.emi' }
    }
}

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    def replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             AE2_version_range      : AE2_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
neoForge.ideSyncTask generateModMetadata

apply from: new File(myotusRootDir, 'gradle/verify-wt-publication.gradle')
