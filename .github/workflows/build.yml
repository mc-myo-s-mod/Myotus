name: Build Mod

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  common-tests:
    name: Test common code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run common tests
        run: |
          chmod +x ./gradlew
          ./gradlew :common:test --build-cache --no-daemon --console=plain

  build:
    name: Build ${{ matrix.minecraft }}
    needs: common-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: forge-1-20-1
            minecraft: 1.20.1
            java_version: |
              17
              21
            gradle_wrapper: ./gradlew
            gradle_project_directory: .
            gradle_task_prefix: ":forge-1-20-1:"
          - module: neoforge-1-21-1
            minecraft: 1.21.1
            java_version: |
              17
              21
            gradle_wrapper: ./gradlew
            gradle_project_directory: .
            gradle_task_prefix: ":neoforge-1-21-1:"
          - module: neoforge-26-1-2
            minecraft: 26.1.2
            java_version: 25
            gradle_wrapper: ./neoforge-26-1-2/gradlew
            gradle_project_directory: neoforge-26-1-2
            gradle_task_prefix: ""

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java toolchains
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make gradlew executable
        run: chmod +x "${{ matrix.gradle_wrapper }}"

      - name: Generate data
        run: |
          "${{ matrix.gradle_wrapper }}" \
            --project-dir "${{ matrix.gradle_project_directory }}" \
            "${{ matrix.gradle_task_prefix }}runData" \
            --no-daemon \
            --stacktrace

      - name: Build with Gradle
        run: |
          "${{ matrix.gradle_wrapper }}" \
            --project-dir "${{ matrix.gradle_project_directory }}" \
            "${{ matrix.gradle_task_prefix }}build" \
            --no-daemon \
            --stacktrace

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Myotus-${{ matrix.minecraft }}-build
          path: ${{ matrix.module }}/build/libs/*.jar
          if-no-files-found: error
